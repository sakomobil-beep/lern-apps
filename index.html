<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lern-Apps für Luca</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#4f8f2f"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Lern-Apps">
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Comic Sans MS","Chalkboard SE",sans-serif;background:#eaf7e1;color:#24331b}
header{background:#4f8f2f;color:#fff;padding:18px 12px;text-align:center}header h1{margin:0;font-size:30px}header p{margin:6px 0 0;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;padding:20px;max-width:1000px;margin:0 auto}
.k{display:block;text-decoration:none;color:inherit;background:#fff;border:3px solid #4f8f2f;border-radius:18px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.k h2{margin:0;background:#4f8f2f;color:#fff;padding:12px 16px;font-size:22px}
.bilder{display:flex;gap:8px;justify-content:center;align-items:center;padding:14px}
.k p{margin:0;padding:0 16px 16px;line-height:1.45}
#instBtn{position:fixed;right:8px;bottom:8px;background:rgba(255,255,255,.85);color:#4f8f2f;border:1px solid #4f8f2f;border-radius:14px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer;opacity:.75}
</style></head><body>
<header><h1>🎓 Lern-Apps für Luca</h1><p>Such dir aus, was du üben willst!</p></header>
<div class="grid">
<a class="k" href="baum-detektiv/"><h2>🌳 Baum-Detektiv</h2>
<div class="bilder"><img src="baum-detektiv/img/eiche_baum.jpg" alt="" style="height:100px"><img src="baum-detektiv/img/ahorn_blatt.jpg" alt="" style="height:64px"><img src="baum-detektiv/img/kastanie_frucht.jpg" alt="" style="height:52px"></div>
<p>Laub- und Nadelbäume: Lernkarten, Baum – Blatt – Frucht, Laub oder Nadel, Aufbau von Baum und Blatt, Steckbriefe.</p></a>
</div>
<button id="instBtn" hidden>📲 App installieren</button>
<script>
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
(function(){var b=document.getElementById('instBtn'),dp=null;
if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)return;
var ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),andr=/Android/i.test(navigator.userAgent);
addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;b.hidden=false});
if(ios||andr||location.search.indexOf('install')>=0)b.hidden=false;
b.onclick=function(){if(dp){dp.prompt();dp.userChoice.then(function(){dp=null;b.hidden=true})}else if(ios){alert('So geht es: auf das Teilen-Symbol tippen und dann „Zum Home-Bildschirm“ wählen.')}else{alert('So geht es: oben rechts im Chrome-Menü ⋮ auf „App installieren“ bzw. „Zum Startbildschirm hinzufügen“ tippen.')}};
addEventListener('appinstalled',function(){b.hidden=true})})();
</script>
</body></html>
